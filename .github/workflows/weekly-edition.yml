name: Weekly Edition Publication

# Two triggers:
#   - workflow_dispatch: manual runs, edition_date supplied explicitly.
#   - schedule: automatic weekly run, Friday 06:00 Japan Standard Time
#     (= Thursday 21:00 UTC; JST has no DST, so this offset is constant
#     year-round). Cron always evaluates in UTC, but the "Resolve edition
#     date" step below computes the actual Japan-local calendar date at
#     runtime rather than assuming the UTC date — the two can disagree on
#     which calendar date it currently is.
on:
  workflow_dispatch:
    inputs:
      edition_date:
        description: "Edition date (YYYY-MM-DD)"
        required: true
        type: string
  schedule:
    - cron: "0 21 * * 4"

permissions:
  contents: write

# Never let two publication runs race each other; never cancel a run that's
# already partway through generation/validation/commit/push.
concurrency:
  group: weekly-edition-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # GDELT discovery (~16 sources with rate-limit delays) + several OpenAI
    # calls + Commons image sourcing (+ possible AI-image fallback) +
    # lint + build can together take several minutes; well short of 40,
    # but the default 6-hour ceiling is not an acceptable substitute for an
    # explicit bound.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Establishes ONE resolved EDITION_DATE value, used by every step below
      # it — never re-derived, so manual and scheduled runs can't disagree
      # with themselves about what date they're publishing.
      - name: Resolve edition date
        id: resolve_date
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EDITION_DATE="${{ inputs.edition_date }}"
          else
            # Scheduled run: no input to read. Compute the Japan-local
            # calendar date directly — never derive it from the UTC date,
            # since at Thursday 21:00 UTC (Friday 06:00 JST) the two
            # calendar dates differ.
            EDITION_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi
          echo "Resolved EDITION_DATE=$EDITION_DATE (trigger: ${{ github.event_name }})"
          echo "edition_date=$EDITION_DATE" >> "$GITHUB_OUTPUT"

      - name: Validate edition_date format
        run: |
          set -euo pipefail
          DATE="${{ steps.resolve_date.outputs.edition_date }}"
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::edition_date must be exactly YYYY-MM-DD, got: '$DATE'"
            exit 1
          fi
          # Format alone doesn't catch e.g. "2026-13-45" — confirm it's a
          # real calendar date too.
          if ! date -u -d "$DATE" '+%Y-%m-%d' | grep -qx "$DATE"; then
            echo "::error::edition_date is not a valid calendar date: '$DATE'"
            exit 1
          fi

      - name: Refuse to overwrite an existing edition
        run: |
          set -euo pipefail
          EDITION_FILE="src/data/editions/${{ steps.resolve_date.outputs.edition_date }}.ts"
          if [ -f "$EDITION_FILE" ]; then
            echo "::error::$EDITION_FILE already exists. This automated publisher never overwrites an existing edition (ALLOW_OVERWRITE is intentionally not used here)."
            exit 1
          fi

      # The hard gate: generation -> validation -> retention -> post-retention
      # validation -> lint -> build, in that order, stopping at the first
      # failure (scripts/prepare-weekly-edition.mjs). This workflow does not
      # reimplement any of that logic — it only trusts the orchestrator's
      # exit code. Retention never runs before the first validation has
      # already confirmed the newly generated edition is sound, and a second
      # validation pass runs immediately after retention, before lint/build.
      - name: Run publication-preparation gate (generate -> validate -> retain -> validate -> lint -> build)
        env:
          EDITION_DATE: ${{ steps.resolve_date.outputs.edition_date }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run prepare:edition

      - name: Verify expected artifacts and stage them explicitly
        env:
          EDITION_DATE: ${{ steps.resolve_date.outputs.edition_date }}
        run: |
          set -euo pipefail

          EDITION_FILE="src/data/editions/${EDITION_DATE}.ts"
          if [ ! -f "$EDITION_FILE" ]; then
            echo "::error::Preparation reported success but $EDITION_FILE does not exist. Refusing to commit."
            exit 1
          fi

          # The Retention stage inside `npm run prepare:edition` always
          # writes a precise manifest of exactly which old edition
          # files/images it intentionally removed, even on a no-op run —
          # its absence here means something is wrong; never guess.
          MANIFEST="scripts/output/retention-report-${EDITION_DATE}.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Retention manifest not found at $MANIFEST — refusing to commit without a precise record of what retention intentionally removed."
            exit 1
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required to read the retention manifest but is not available on this runner."
            exit 1
          fi

          ALLOWED_REMOVED_EDITIONS="$(mktemp)"
          ALLOWED_REMOVED_IMAGES="$(mktemp)"
          jq -r '.removedEditionFiles[]' "$MANIFEST" > "$ALLOWED_REMOVED_EDITIONS"
          jq -r '.removedImages[]' "$MANIFEST" > "$ALLOWED_REMOVED_IMAGES"

          # Defense in depth: never trust the manifest's contents blindly.
          # Every listed path must have exactly the expected shape, and the
          # edition just published this run must never appear as removed.
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if ! [[ "$p" =~ ^src/data/editions/[0-9]{4}-[0-9]{2}-[0-9]{2}\.ts$ ]]; then
              echo "::error::Retention manifest lists an edition-file path with an unexpected shape: $p"
              exit 1
            fi
            if [ "$p" = "$EDITION_FILE" ]; then
              echo "::error::Retention manifest lists the edition just published ($EDITION_FILE) as removed — refusing."
              exit 1
            fi
          done < "$ALLOWED_REMOVED_EDITIONS"
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if ! [[ "$p" =~ ^public/images/stories/[^/]+$ ]]; then
              echo "::error::Retention manifest lists an image path with an unexpected shape: $p"
              exit 1
            fi
          done < "$ALLOWED_REMOVED_IMAGES"

          echo "Changed paths reported by git status:"
          git status --porcelain --untracked-files=all

          # Classify every changed/untracked path in the whole working tree.
          # Never `git add -A` — only ever stage paths we've explicitly
          # recognized as an expected publication artifact. A DELETION under
          # src/data/editions/ or public/images/stories/ is only ever
          # accepted when it exactly matches this run's retention manifest
          # — never a blanket glob for deletions — so an unrelated or
          # unintended deletion still aborts publication. Non-deletion
          # changes under public/images/stories/ (this run's newly sourced
          # images) keep their existing, already-proven behavior.
          UNEXPECTED=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            status="${line:0:2}"
            path="${line:3}"
            case "$path" in
              "$EDITION_FILE") ;;
              "src/data/editions/index.ts") ;;
              "IMAGE_CREDITS.md") ;;
              src/data/editions/*.ts)
                if [[ "$status" == *D* ]] && grep -qxF -- "$path" "$ALLOWED_REMOVED_EDITIONS"; then
                  :
                else
                  UNEXPECTED="${UNEXPECTED}${path}"$'\n'
                fi
                ;;
              public/images/stories/*)
                if [[ "$status" == *D* ]] && ! grep -qxF -- "$path" "$ALLOWED_REMOVED_IMAGES"; then
                  UNEXPECTED="${UNEXPECTED}${path}"$'\n'
                fi
                ;;
              # Generation's own report JSON — a known, expected, but
              # never-committed byproduct (see scripts/output/ convention
              # throughout this project). Not staged below.
              scripts/output/*) ;;
              *)
                UNEXPECTED="${UNEXPECTED}${path}"$'\n' ;;
            esac
          done < <(git status --porcelain --untracked-files=all)

          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected changed path(s) outside the known publication-artifact allowlist — refusing to commit:"
            echo "$UNEXPECTED"
            exit 1
          fi

          git add "$EDITION_FILE"
          git add src/data/editions/index.ts
          git add IMAGE_CREDITS.md
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line:3}"
            git add "$path"
          done < <(git status --porcelain --untracked-files=all -- src/data/editions/)
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line:3}"
            git add "$path"
          done < <(git status --porcelain --untracked-files=all -- public/images/stories/)

          if git diff --cached --quiet; then
            echo "::error::Nothing staged after a successful preparation run — refusing to publish an empty commit."
            exit 1
          fi

          echo "Staged files:"
          git diff --cached --name-only

      - name: Commit
        env:
          EDITION_DATE: ${{ steps.resolve_date.outputs.edition_date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: publish ${EDITION_DATE} news edition [automated]"

      - name: Push to main
        run: git push origin HEAD:main
